# This file generates the GitHub Actions matrix.
# See https://zmk.dev/docs/user-setup for the format.
---
include:
  # The left half is the USB/BLE central: Studio RPC lives here only.
  - board: elkhorn_flat_v1_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  # The right half remains a BLE peripheral.
  - board: elkhorn_flat_v1_right

  # Flash these to both halves to clear pairing and settings (including
  # keymap changes saved from Studio), then flash the normal firmware.
  - board: elkhorn_flat_v1_left
    shield: settings_reset
  - board: elkhorn_flat_v1_right
    shield: settings_reset
